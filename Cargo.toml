[workspace]
resolver = "3"
members = [
    "crates/workspace-core",
    "crates/workspace-client",
    "crates/workspace-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/workspace"
publish = false

[workspace.dependencies]
workspace-core = { path = "crates/workspace-core" }
workspace-client = { path = "crates/workspace-client" }
identity-client = { git = "ssh://git@github.com/beyond10x/identity.git", tag = "0.3.2" }
connectors-client = { git = "ssh://git@github.com/beyond10x/connectors.git", rev = "dbf4957ee937aec9b64ac69c22b13d37f38e1725" }

anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "sqlite", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
