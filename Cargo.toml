[workspace]
resolver = "3"
members = [
    "crates/workspace-core",
    "crates/workspace-client",
    "crates/workspace-service",
]

[workspace.package]
version = "0.2.11"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/workspace"
publish = false

[workspace.dependencies]
workspace-core = { path = "crates/workspace-core" }
workspace-client = { path = "crates/workspace-client" }
identity-client = { git = "https://github.com/beyond10x/identity.git", tag = "0.5.6" }
connectors-client = { git = "https://github.com/beyond10x/connectors.git", tag = "v0.5.4" }
agent-platform-client = { git = "https://github.com/beyond10x/agent-platform.git", tag = "0.6.6" }
agent-platform-core = { git = "https://github.com/beyond10x/agent-platform.git", tag = "0.6.6" }
agentide-contracts = { git = "https://github.com/beyond10x/agentide.git", tag = "0.2.1" }
aep-client = { git = "https://github.com/beyond10x/aep", tag = "0.45.0" }
aep-contract = { git = "https://github.com/beyond10x/aep", tag = "0.45.0" }
b10x-substrate-sdk = { git = "https://github.com/beyond10x/substrate.git", tag = "0.5.0" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "sqlite", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
unused_async_trait_impl = "allow"
