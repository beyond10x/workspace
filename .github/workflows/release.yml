name: Release Workspace runtime

on:
  pull_request:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing version tag to recover
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit named by the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise publication policy without credentials or writes
        run: |
          rustc --edition=2024 --deny warnings --test ci/release.rs -o /tmp/release-tests
          /tmp/release-tests
          rustc --edition=2024 --deny warnings ci/release.rs -o /tmp/release-helper
          rustc --edition=2024 --deny warnings --test ci/release_adversary.rs -o /tmp/release-adversary-tests
          mkdir -p "$RUNNER_TEMP/release-adversary"
          TMPDIR="$RUNNER_TEMP/release-adversary" ADV_HELPER=/tmp/release-helper /tmp/release-adversary-tests
          rustfmt --edition=2024 --check ci/release.rs ci/release_adversary.rs

  verify:
    needs: policy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source: ${{ steps.prepare.outputs.source }}
      published: ${{ steps.prepare.outputs.published }}
      build: ${{ steps.prepare.outputs.build }}
      resume: ${{ steps.prepare.outputs.resume }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-control
          persist-credentials: false
      - name: Compile trusted release policy
        run: rustc --edition=2024 --deny warnings release-control/ci/release.rs -o /tmp/release-helper
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify tag, source, default branch, version, and private registry target
        id: prepare
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}
          WORKSPACE_BOOTSTRAP_SOURCE: ${{ vars.WORKSPACE_BOOTSTRAP_SOURCE }}
        run: /tmp/release-helper prepare
      - name: Preserve the trusted policy for both native runners
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-release-policy
          path: release-control/ci/release.rs
          if-no-files-found: error

  images:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-release-policy
          path: release-control
      - name: Read-only source dependency token
        id: dependencies
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          repositories: |
            aep
            agent-platform
            agentide
            connectors
            identity
            substrate
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=workspace-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ needs.verify.outputs.source }}
          secrets: github_token=${{ steps.dependencies.outputs.token }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: workspace-smoke:local
      - name: Smoke the exact image before publishing
        run: |
          rustc --edition=2024 --deny warnings release-control/release.rs -o /tmp/release-helper
          /tmp/release-helper smoke workspace-smoke:local
      - name: Publish inspected native image under a unique attempt tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}
          WORKSPACE_BOOTSTRAP_SOURCE: ${{ vars.WORKSPACE_BOOTSTRAP_SOURCE }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source }}
          ARCH: ${{ matrix.arch }}
        run: |
          /tmp/release-helper private
          target="${WORKSPACE_IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag workspace-smoke:local "$target"
          docker push "$target"
          /tmp/release-helper private-existing
          docker buildx imagetools inspect "$target" --format '{{json .Manifest.Digest}}' | tr -d '"' > "${ARCH}.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-${{ matrix.arch }}-digest
          path: ${{ matrix.arch }}.digest
          if-no-files-found: error

  publish:
    needs: [verify, images]
    if: >-
      always() && needs.verify.result == 'success'
      && (needs.images.result == 'success' || needs.verify.outputs.resume == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspace-release-policy
          path: release-control
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.verify.outputs.build == 'true'
        with:
          pattern: workspace-*-digest
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish immutable signed release metadata
        if: needs.verify.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source }}
        run: |
          rustc --edition=2024 --deny warnings release-control/release.rs -o /tmp/release-helper
          /tmp/release-helper private-existing
          export AMD64_DIGEST=$(cat amd64.digest)
          export ARM64_DIGEST=$(cat arm64.digest)
          docker buildx imagetools create --tag "${WORKSPACE_IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${WORKSPACE_IMAGE}@${AMD64_DIGEST}" "${WORKSPACE_IMAGE}@${ARM64_DIGEST}"
          export IMAGE_DIGEST=$(docker buildx imagetools inspect "${WORKSPACE_IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          /tmp/release-helper manifest
          cosign sign --yes "${WORKSPACE_IMAGE}@${IMAGE_DIGEST}"
          cosign verify "${WORKSPACE_IMAGE}@${IMAGE_DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          /tmp/release-helper private-existing
          # Release metadata is the immutable version identity. Never clobber existing assets.
          # A failed draft can retry; successful releases already returned as exact no-ops.
          /tmp/release-helper announce
      - name: Finish an interrupted draft using its verified existing receipt
        if: needs.verify.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE_IMAGE: ${{ vars.WORKSPACE_IMAGE }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source }}
        run: |
          rustc --edition=2024 --deny warnings release-control/release.rs -o /tmp/release-helper
          /tmp/release-helper announce
