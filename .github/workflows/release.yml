name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match source and tag versions
        run: |
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$source_version" = "$GITHUB_REF_NAME"
          grep -q "^## ${GITHUB_REF_NAME} - " CHANGELOG.md
      - name: Token for private dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            aep
            agent-platform
            connectors
            identity
            substrate
      - name: Authenticate Cargo git dependencies
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/beyond10x/".insteadOf \
            "https://github.com/beyond10x/"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  images:
    needs: validate
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Token for private dependencies
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            aep
            agent-platform
            connectors
            identity
            substrate
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=workspace-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=workspace-release-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: github_token=${{ steps.app-token.outputs.token }}
          tags: ghcr.io/beyond10x/workspace-service:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish and sign the immutable manifest
        id: artifact
        run: |
          image="ghcr.io/beyond10x/workspace-service:${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            --tag "$image" \
            "${image}-amd64" \
            "${image}-arm64"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          cosign sign --yes "ghcr.io/beyond10x/workspace-service@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Keep the runtime package private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /orgs/beyond10x/packages/container/workspace-service --jq .visibility)" = private
      - name: Write release manifest
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          jq --null-input \
            --arg version "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg image "$DIGEST" \
            '{schema:1, version:$version, source_commit:$commit, artifacts:{workspace_service:$image}}' \
            > release-manifest.json
      - name: Release token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: workspace
      - name: Announce the immutable release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-manifest.json \
            --repo beyond10x/workspace \
            --verify-tag \
            --title "Workspace ${GITHUB_REF_NAME}" \
            --generate-notes
